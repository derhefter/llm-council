name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      # The suite stubs the model client, so no OPENROUTER_API_KEY is needed
      # and no request ever leaves the runner.
      - name: Run tests
        run: uv run pytest
